<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生日快樂 Ernest 🎂 · Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box }

  :root {
    --bg-deep: #12080f;
    --bg-mid: #241020;
    --rose: #e8637d;
    --rose-soft: #ffb3c1;
    --gold: #e8c25a;
    --gold-soft: #f0d88a;
    --amber: #c8912f;
    --ink: #fdf0f4;
    --muted: #c79ba9;
  }

  html { scroll-behavior: smooth }

  body {
    background: radial-gradient(circle at 50% -10%, #3a1628 0%, var(--bg-mid) 35%, var(--bg-deep) 75%);
    font-family: 'Inter', 'Noto Serif TC', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ─── Confetti canvas layer ─────────────── */
  #confetti { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden }

  /* ─── Spotlight beam ────────────────────── */
  .spotlight {
    position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
    width: 60vw; height: 70vh; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(232,99,125,0.18), transparent 70%);
    filter: blur(30px); animation: sway 9s ease-in-out infinite alternate;
  }
  @keyframes sway { from { transform: translateX(-60%) rotate(-6deg) } to { transform: translateX(-40%) rotate(6deg) } }

  .wrap {
    position: relative; z-index: 2; max-width: 820px; margin: 0 auto;
    padding: clamp(3rem, 8vw, 6rem) 1.5rem clamp(4rem, 8vw, 7rem);
  }

  /* ─── Hero ──────────────────────────────── */
  .hero { text-align: center; margin-bottom: 2.5rem; animation: fadeUp 1s cubic-bezier(.2,.5,.3,1) forwards; opacity: 0 }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: translateY(0) } }

  .balloon-row { display: flex; justify-content: center; gap: 16px; margin-bottom: 24px }
  .balloon-row span { animation: bob 3.5s ease-in-out infinite; display: inline-block; font-size: 38px }
  .balloon-row span:nth-child(2) { animation-delay: -0.6s }
  .balloon-row span:nth-child(3) { animation-delay: -1.2s }
  .balloon-row span:nth-child(4) { animation-delay: -1.8s }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-14px) rotate(3deg) } }

  .eyebrow {
    display: inline-block; letter-spacing: 5px; text-transform: uppercase; font-size: 12px; font-weight: 700;
    color: var(--rose-soft); padding: 8px 20px; border-radius: 30px; margin-bottom: 22px;
    background: rgba(232,99,125,0.1); border: 1px solid rgba(232,99,125,0.3);
  }

  .hero h1 {
    font-family: 'Noto Serif TC', serif; font-weight: 900; line-height: 1.05; margin-bottom: 8px;
    font-size: clamp(46px, 12vw, 84px);
    background: linear-gradient(180deg, #fff3f6 0%, var(--rose) 45%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 4px 24px rgba(232,99,125,0.35));
  }
  .hero h2 {
    font-family: 'Noto Serif TC', serif; font-weight: 700; color: var(--gold-soft);
    font-size: clamp(26px, 7vw, 44px); margin-bottom: 18px; letter-spacing: 1px;
  }
  .hero p { font-size: clamp(15px, 4vw, 18px); color: var(--muted); max-width: 520px; margin: 0 auto; line-height: 1.7 }

  /* ─── Wish carousel ─────────────────────── */
  .wish-card {
    position: relative; margin: 3rem auto; padding: clamp(26px, 6vw, 40px); text-align: center;
    background: linear-gradient(160deg, rgba(232,99,125,0.08), rgba(232,194,90,0.06));
    border: 1px solid rgba(232,99,125,0.25); border-radius: 24px; overflow: hidden;
    min-height: 170px; display: flex; flex-direction: column; justify-content: center;
    animation: fadeUp 1s cubic-bezier(.2,.5,.3,1) .2s forwards; opacity: 0;
  }
  .wish-card::before {
    content: '\2764'; position: absolute; top: -28px; right: 22px; font-size: 90px;
    color: rgba(232,99,125,0.12); animation: heartPulse 2.4s ease-in-out infinite;
  }
  @keyframes heartPulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
  .wish-line {
    font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: clamp(20px, 5.5vw, 28px);
    color: var(--ink); line-height: 1.5; transition: opacity .5s ease; position: relative; z-index: 1;
  }
  .wish-sub { margin-top: 14px; font-size: 15px; color: var(--rose-soft); letter-spacing: 1px; transition: opacity .5s ease }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 20px }
  .dots b { width: 8px; height: 8px; border-radius: 50%; background: rgba(232,99,125,0.3); transition: all .3s ease }
  .dots b.on { background: var(--rose); transform: scale(1.3) }

  /* ─── Cake ──────────────────────────────── */
  .cake-section { text-align: center; margin: 3rem auto; animation: fadeUp 1s cubic-bezier(.2,.5,.3,1) .35s forwards; opacity: 0 }
  .cake-hint { font-size: 14px; color: var(--muted); margin-bottom: 18px; letter-spacing: 1px }
  .cake-hint b { color: var(--rose-soft) }

  .cake-wrap { perspective: 900px; display: flex; justify-content: center; padding: 24px 0 6px }
  .cake { position: relative; width: 230px; margin: 0 auto; cursor: pointer; user-select: none; transform-style: preserve-3d; transition: transform .3s ease }
  .cake:hover { transform: translateY(-4px) rotateX(4deg) }

  /* Plate */
  .plate { position: relative; width: 270px; height: 16px; margin: 0 auto; border-radius: 50%; background: linear-gradient(180deg,#f4e9c8,#d4af37 60%,#a67c2a); box-shadow: 0 14px 28px rgba(0,0,0,.45), inset 0 -4px 8px rgba(0,0,0,.3) }
  .plate::before { content:''; position:absolute; left:50%; top:-6px; transform:translateX(-50%); width:210px; height:8px; border-radius:50%; background:linear-gradient(180deg,#fff,#e8dcc0) }

  /* Layers */
  .layer { position: relative; margin: 0 auto; border-radius: 16px 16px 8px 8px; box-shadow: inset 0 -14px 20px rgba(0,0,0,.12), 0 3px 8px rgba(0,0,0,.15) }
  .l-top { width: 150px; height: 62px; background: linear-gradient(180deg,#fffaf0,#ffe4ec); margin-top: -2px; z-index: 3; overflow: visible }
  .l-mid { width: 190px; height: 66px; background: linear-gradient(180deg,#fff5d6,#f7d98c); margin-top: -2px; z-index: 2 }
  .l-bot { width: 230px; height: 72px; background: linear-gradient(180deg,#ffe4ec,#f4a9bd); margin-top: -2px; z-index: 1 }

  /* Frosting drip on each layer */
  .drips { position: absolute; left: 0; right: 0; top: -5px; height: 30px; z-index: 4; pointer-events: none }
  .drip { position: absolute; top: 0; width: 26px; border-radius: 0 0 14px 14px; background: linear-gradient(180deg,#fffefb,#fff3f5) }
  .drips.t1 .drip { height: 22px }
  .drips.t2 .drip { height: 28px }
  .drips.t3 .drip { height: 24px }

  /* Sprinkles */
  .sprinkle { position: absolute; width: 7px; height: 3.5px; border-radius: 2px; opacity: .95; box-shadow: 0 1px 1px rgba(0,0,0,.08) }

  /* Cherry toppers */
  .cherry { position: absolute; top: -14px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#ff7a94,#d62f4e); box-shadow: inset -2px -2px 3px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.2); z-index: 5 }
  .cherry::after { content:''; position:absolute; top:-10px; left:6px; width:2px; height:10px; background:#3f7a3a; border-radius:2px; transform:rotate(8deg) }

  /* ─── Candle + flame ────────────────────── */
  .candle { position: absolute; top: -56px; left: 50%; transform: translateX(-50%); width: 14px; height: 52px; border-radius: 3px 3px 0 0; background: repeating-linear-gradient(45deg,var(--rose) #0 7px,#fff0f3 #7px 14px); box-shadow: inset -3px 0 4px rgba(0,0,0,.12), inset 3px 0 4px rgba(255,255,255,.4) }
  .candle::after { content:''; position:absolute; top:-6px; left:0; right:0; height:8px; background:repeating-linear-gradient(45deg,var(--gold) #0 7px,#fff0f3 #7px 14px); border-radius:50% }
  .flame { position: absolute; top: -82px; left: 50%; transform: translateX(-50%); width: 20px; height: 30px; border-radius: 50% 50% 50% 50%/62% 62% 38% 38%; background: radial-gradient(circle at 50% 72%, #fffef0 0%, #ffd45a 38%, #ff9a20 70%, #e04b1a 100%); box-shadow: 0 0 30px 12px rgba(255,160,40,.55), 0 0 60px 20px rgba(255,120,40,.22); animation: flicker .18s ease-in-out infinite alternate }
  @keyframes flicker { from { transform: translateX(-50%) scale(1) rotate(-2deg) } to { transform: translateX(-50%) scale(1.12,1.06) rotate(2deg) } }
  .flame.out { opacity: 0; transform: translateX(-50%) scale(.15); transition: opacity .3s ease, transform .3s ease }
  .smoke { position: absolute; top: -94px; left: 50%; width: 6px; height: 28px; border-radius: 10px; background: rgba(200,200,200,.0); transform: translateX(-50%); transition: opacity .4s ease }
  .smoke.on { animation: smokeRise 1.6s ease-out forwards }
  @keyframes smokeRise { 0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(1) } 40% { opacity: .5 } 100% { opacity: 0; transform: translateX(-50%) translateY(-42px) scale(2.4) } }

  /* Little banner on the cake */
  .banner { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-family:'Noto Serif TC',serif; font-weight:700; font-size:12px; color:#fff; letter-spacing:1px; background:linear-gradient(90deg,var(--rose),var(--gold)); padding:3px 10px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,.25); white-space:nowrap; z-index:6 }

  .wish-msg { margin-top: 24px; font-family: 'Noto Serif TC', serif; font-size: clamp(18px, 5vw, 24px); color: var(--gold-soft); opacity: 0; transform: translateY(10px); transition: all .6s ease }
  .wish-msg.show { opacity: 1; transform: translateY(0) }

  /* ─── Message card ──────────────────────── */
  .msg-card {
    margin-top: 3rem; padding: clamp(28px, 6vw, 40px); text-align: center;
    background: linear-gradient(160deg, rgba(232,99,125,0.1), rgba(232,194,90,0.05));
    border: 1px solid rgba(232,99,125,0.3); border-radius: 26px; position: relative; overflow: hidden;
    animation: fadeUp 1s cubic-bezier(.2,.5,.3,1) .5s forwards; opacity: 0;
  }
  .msg-card h3 { font-family: 'Noto Serif TC', serif; font-size: clamp(22px, 6vw, 30px); color: var(--rose-soft); margin-bottom: 14px }
  .msg-card p { font-size: clamp(15px, 4vw, 17px); color: var(--ink); line-height: 1.8; max-width: 560px; margin: 0 auto }
  .signature { margin-top: 22px; font-size: 14px; color: var(--muted) }
  .signature b { color: var(--rose-soft) }

  /* ─── Footer ────────────────────────────── */
  .foot { text-align: center; margin-top: 3rem; font-size: 13px; color: var(--muted); opacity: .7 }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important }
  }
</style>
</head>
<body>

<div id="confetti"></div>
<div class="spotlight"></div>

<div class="wrap">

  <!-- HERO -->
  <header class="hero">
    <div class="balloon-row"><span>🎈</span><span>🎉</span><span>🎁</span><span>🎊</span></div>
    <span class="eyebrow">Happy Birthday · 生日快樂</span>
    <h1>生日快樂</h1>
    <h2>Ernest 🎂</h2>
    <p>今日你最大！撳落去吹熄支蠟燭、許個願，然後收咁一堆彩帶啦。🎈</p>
  </header>

  <!-- WISH CAROUSEL -->
  <div class="wish-card">
    <div class="wish-line" id="wishLine"></div>
    <div class="wish-sub" id="wishSub"></div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- CAKE -->
  <section class="cake-section">
    <p class="cake-hint">👇 撳落去吹熄支蠟燭，許個願 👇</p>
    <div class="cake-wrap">
      <div class="cake" id="cake" role="button" aria-label="Blow out the candle" tabindex="0">
        <!-- Cherry + candle -->
        <span class="cherry" style="left:50%; transform:translateX(-50%)"></span>
        <span class="banner">Happy Birthday</span>
        <span class="candle"></span>
        <span class="flame" id="flame"></span>
        <span class="smoke" id="smoke"></span>

        <!-- Top layer -->
        <div class="layer l-top">
          <div class="drips t1"><span class="drip" style="left:14%"></span><span class="drip" style="left:50%;transform:translateX(-50%)"></span><span class="drip" style="right:14%"></span></div>
        </div>
        <!-- Mid layer -->
        <div class="layer l-mid">
          <div class="drips t2"><span class="drip" style="left:10%"></span><span class="drip" style="left:45%;transform:translateX(-50%)"></span><span class="drip" style="right:10%"></span></div>
        </div>
        <!-- Bottom layer -->
        <div class="layer l-bot">
          <div class="drips t3"><span class="drip" style="left:8%"></span><span class="drip" style="left:32%;transform:translateX(-50%)"></span><span class="drip" style="left:60%;transform:translateX(-50%)"></span><span class="drip" style="right:8%"></span></div>
        </div>
        <!-- Plate -->
        <div class="plate"></div>
      </div>
    </div>
    <p class="wish-msg" id="wishMsg">願望一定會實現 —— 因為今日係你嘅大日子！🌟</p>
  </section>

  <!-- MESSAGE -->
  <section class="msg-card">
    <h3>🎉 致 Ernest 🎉</h3>
    <p>又長大一歲，就又多一歲嘅靚仔。願新嘅一年身體健康、事事順心、想乜都得、笑口常開 —— 最重要係每日都咁開心！Happy Birthday！🎂</p>
    <div class="signature">With love &amp; best wishes · From your mates 🤙</div>
  </section>

  <footer class="foot">
    Made with ❤️ for Ernest
  </footer>

</div>

<script>
// ─── Wish carousel ────────────────────────
const wishes = [
  { line: "願望成真，日日開心的！", sub: "🌟 Best Wishes" },
  { line: "身體健康，萬事勝意", sub: "💪 Health & Joy" },
  { line: "想乜就有乜，美夢成雙", sub: "✨ All The Best" },
  { line: "年年有今日，歲歲有今朝", sub: "🎉 Forever Celebrations" },
  { line: "青春常駐，笑口常開", sub: "😄 Endless Smiles" }
];
let qi = 0;
const wLine = document.getElementById('wishLine');
const wSub = document.getElementById('wishSub');
const dotsWrap = document.getElementById('dots');

wishes.forEach((_, i) => {
  const d = document.createElement('b');
  if (i === 0) d.classList.add('on');
  dotsWrap.appendChild(d);
});
const dots = dotsWrap.children;

function showWish(i) {
  wLine.style.opacity = '0'; wSub.style.opacity = '0';
  setTimeout(() => {
    wLine.textContent = wishes[i].line;
    wSub.textContent = wishes[i].sub;
    wLine.style.opacity = '1'; wSub.style.opacity = '1';
    for (let k = 0; k < dots.length; k++) dots[k].classList.toggle('on', k === i);
  }, 250);
}
showWish(0);
setInterval(() => { qi = (qi + 1) % wishes.length; showWish(qi); }, 4000);

// ─── Cake: blow out candle ────────────────
const cake = document.getElementById('cake');
const flame = document.getElementById('flame');
const smoke = document.getElementById('smoke');
const wishMsg = document.getElementById('wishMsg');
let blown = false;

function blow() {
  if (!blown) {
    blown = true;
    flame.classList.add('out');
    smoke.classList.add('on');
    wishMsg.classList.add('show');
    burstConfetti();
  } else {
    flame.classList.remove('out');
    smoke.classList.remove('on');
    burstConfetti();
  }
}
cake.addEventListener('click', blow);
cake.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blow(); } });

// ─── Confetti ─────────────────────────────
const confetti = document.getElementById('confetti');
const COLORS = ['#e8637d', '#ffb3c1', '#e8c25a', '#f0d88a', '#fff0f3'];

function makePiece() {
  const p = document.createElement('span');
  const size = Math.random() * 8 + 6;
  p.style.cssText = `position:absolute;left:${Math.random()*100}%;top:-14px;width:${size}px;height:${size*1.6}px;background:${COLORS[Math.floor(Math.random()*COLORS.length)]};border-radius:${Math.random()>.5?'50%':'2px'};opacity:.95;transform:rotate(${Math.random()*360}deg)`;
  confetti.appendChild(p);
  const fall = Math.random() * 1400 + 1200;
  const sway = (Math.random() - .5) * 120;
  p.animate(
    [{ transform: `translateY(0) translateX(0) rotate(0deg)` },
     { transform: `translateY(100vh) translateX(${sway}px) rotate(${720 + Math.random()*540}deg)` }],
    { duration: fall, easing: 'cubic-bezier(.25,.6,.4,1)' }
  ).onfinish = () => p.remove();
}
function burstConfetti() { for (let i = 0; i < 60; i++) setTimeout(makePiece, i * 12); }

// gentle ambient confetti on load
setTimeout(() => { for (let i = 0; i < 24; i++) setTimeout(makePiece, i * 60); }, 900);

// ─── Scatter sprinkles on each layer ──────
const SPRINKLE_COLORS = ['#e8637d','#ffb3c1','#e8c25a','#f0d88a','#fff0f3','#7ec8e3','#b39ddb'];
document.querySelectorAll('.layer').forEach(layer => {
  const count = 14;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'sprinkle';
    s.style.left = (Math.random() * 86 + 7) + '%';
    s.style.top = (Math.random() * 72 + 10) + '%';
    s.style.background = SPRINKLE_COLORS[Math.floor(Math.random() * SPRINKLE_COLORS.length)];
    s.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    layer.appendChild(s);
  }
});
</script>
</body>
</html>
