<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Skee-Ball 🎳</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0c120c;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #ecfccb;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ── HUD ── */
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; gap: 10px;
    background: linear-gradient(180deg, #131f13, #0e170e);
    border-bottom: 1px solid rgba(134,196,118,0.25);
    z-index: 5;
  }
  .hud-block { display: flex; flex-direction: column; min-width: 70px; }
  .hud-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #7a8f6e; }
  .hud-value { font-size: 22px; font-weight: 800; color: #f5e6a8; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .hud-block.center { align-items: center; text-align: center; }
  #ballDots { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; justify-content: center; max-width: 150px; }
  .bdot { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffd97a, #d4841d 65%, #7a4a10); box-shadow: 0 0 6px rgba(255,190,80,0.5); }
  .bdot.spent { background: #2a352a; box-shadow: none; opacity: 0.45; }
  #title { font-size: 15px; font-weight: 800; letter-spacing: 3px; color: #a7c4a0; text-transform: uppercase; }
  #muteBtn {
    background: rgba(134,196,118,0.12); border: 1px solid rgba(134,196,118,0.35);
    color: #a7c4a0; border-radius: 8px; padding: 6px 10px; font-size: 15px; cursor: pointer;
  }
  #muteBtn:active { background: rgba(134,196,118,0.3); }

  /* ── Stage ── */
  #stage { flex: 1; position: relative; min-height: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #game.rolling { cursor: grabbing; }

  #hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12.5px; color: #8a9e82; background: rgba(10,16,10,0.7);
    padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(134,196,118,0.2);
    white-space: nowrap; pointer-events: none; transition: opacity 0.6s;
  }
  #hint.hidden { opacity: 0; }

  /* ── Game over overlay ── */
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(6,10,6,0.82); backdrop-filter: blur(3px); z-index: 10;
  }
  #overlay.show { display: flex; }
  .panel {
    background: linear-gradient(160deg, #182618, #101a10);
    border: 1px solid rgba(134,196,118,0.4);
    border-radius: 18px; padding: 30px 38px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    max-width: 340px; width: 88%;
  }
  .panel h2 { font-size: 26px; font-weight: 800; margin-bottom: 4px; color: #ecfccb; }
  .panel .rank { font-size: 17px; font-weight: 700; color: #f5b041; margin-bottom: 16px; letter-spacing: 1px; }
  .panel .big { font-size: 44px; font-weight: 900; color: #f5e6a8; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .panel .sub { font-size: 12px; color: #7a8f6e; margin-bottom: 18px; }
  .panel .newhigh {
    display: none; font-size: 13px; font-weight: 800; color: #7fdbca;
    letter-spacing: 2px; margin-bottom: 10px; animation: pulse 1s infinite alternate;
  }
  .panel .newhigh.show { display: block; }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
  #againBtn {
    width: 100%; padding: 14px 0; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #6b9e4a, #4a7a30);
    color: #fff; font-size: 17px; font-weight: 800; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 4px 16px rgba(107,158,74,0.4);
  }
  #againBtn:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="scoreVal">0</span>
    </div>
    <div class="hud-block center">
      <span id="title">🎳 Skee-Ball</span>
      <div id="ballDots"></div>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-label">Best</span>
      <span class="hud-value" id="bestVal" style="font-size:17px;color:#a7c4a0">0</span>
      <button id="muteBtn" title="Toggle sound">🔊</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hint">👆 Push the ball forward &amp; release to roll</div>
    <div id="overlay">
      <div class="panel">
        <h2>Game Over</h2>
        <div class="newhigh" id="newHigh">★ NEW HIGH SCORE ★</div>
        <div class="big" id="finalScore">0</div>
        <div class="sub" id="rankLine">—</div>
        <button id="againBtn">Play Again</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════
  //  Layout (logical units, scaled to fit)
  // ═══════════════════════════════════════════════════════════════
  var LW = 480, LH = 720;
  var LANE = { x: 80, y: 300, w: 320, h: 360 };   // lane rectangle (ball rolls up this)
  var BALL_R = 11;
  var BALL_START = { x: LW / 2, y: 640 };
  var HUMP_Y = LANE.y;                             // ball-hop is at the top of the lane (y=300)

  // ── The iconic target: concentric rings, 1000 = center (hardest) ──
  // Center is farthest back on the target; rings widen outward to 50.
  var CENTER = { x: LW / 2, y: 155 };
  var RINGS = [
    { value: 1000, r: 26 },
    { value: 500,  r: 52 },
    { value: 250,  r: 80 },
    { value: 100,  r: 108 },
    { value: 50,   r: 136 }
  ];
  var RING_HUES = { 1000: 45, 500: 25, 250: 0, 100: 210, 50: 280 };

  // ── Control + flight tuning ──
  // Push the ball forward (up the lane) to set power; drag sideways to aim.
  var MAX_PUSH = 260;        // logical px pushed up for full power
  var MIN_PUSH = 24;         // below this = too weak, no throw
  var AIM_MAX = 120;         // max horizontal aim offset from center
  var FLIGHT_MAX = 145;      // full power lands at CENTER.y (300 - 145 = 155)
  var BALLS_PER_GAME = 9;

  function ringFor(x, y) {
    var d = Math.hypot(x - CENTER.x, y - CENTER.y);
    for (var i = 0; i < RINGS.length; i++) {
      if (d <= RINGS[i].r) return { value: RINGS[i].value, dist: d, ring: RINGS[i] };
    }
    return { value: 0, dist: d, ring: null };   // off the target
  }
  // Predicted landing from a (power, aim) pair — used by both the aim preview
  // and the real throw, so what you see is exactly what you get.
  function landingFor(power, aimOffset) {
    var landY = HUMP_Y - power * FLIGHT_MAX;
    var landX = CENTER.x + aimOffset;
    return { x: landX, y: landY, ring: ringFor(landX, landY) };
  }

  // ═══════════════════════════════════════════════════════════════
  //  DOM
  // ═══════════════════════════════════════════════════════════════
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('scoreVal');
  var bestEl = document.getElementById('bestVal');
  var hintEl = document.getElementById('hint');
  var overlay = document.getElementById('overlay');
  var finalEl = document.getElementById('finalScore');
  var rankEl = document.getElementById('rankLine');
  var newHighEl = document.getElementById('newHigh');
  var muteBtn = document.getElementById('muteBtn');
  var ballDotsEl = document.getElementById('ballDots');

  var bdotEls = [];
  for (var di = 0; di < BALLS_PER_GAME; di++) {
    var sp = document.createElement('span');
    sp.className = 'bdot';
    ballDotsEl.appendChild(sp);
    bdotEls.push(sp);
  }

  // ═══════════════════════════════════════════════════════════════
  //  Audio (synth, no files)
  // ═══════════════════════════════════════════════════════════════
  var actx = null, master = null, muted = false;
  function ensureAudio() {
    if (actx) return actx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.4;
    master.connect(actx.destination);
    return actx;
  }
  function tone(freq, dur, opts) {
    if (muted) return;
    var c = ensureAudio(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    opts = opts || {};
    var t0 = c.currentTime + (opts.delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (opts.freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, opts.freqEnd), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(opts.vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, opts) {
    if (muted) return;
    var c = ensureAudio(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    opts = opts || {};
    var t0 = c.currentTime;
    var len = Math.max(1, Math.floor(c.sampleRate * dur));
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var g = c.createGain();
    g.gain.setValueAtTime(opts.vol || 0.25, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    var f = c.createBiquadFilter();
    f.type = opts.filter || 'lowpass';
    f.frequency.value = opts.freq || 1200;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }
  var sfx = {
    roll: function (p) { noise(0.2, { vol: 0.14 + p * 0.12, filter: 'bandpass', freq: 600 + p * 800 }); },
    hop: function () { tone(180, 0.12, { type: 'triangle', vol: 0.18, freqEnd: 320 }); },
    score: function (val) {
      var f = 300 + Math.log2(val + 1) * 60;
      tone(f, 0.12, { type: 'square', vol: 0.12 });
      noise(0.06, { vol: 0.12, freq: 2600 });
    },
    miss: function () { tone(160, 0.16, { type: 'sawtooth', vol: 0.1, freqEnd: 90 }); },
    ballDone: function () { tone(220, 0.18, { type: 'triangle', vol: 0.16, freqEnd: 140 }); },
    gameOver: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.3, { type: 'triangle', vol: 0.18, delay: i * 0.18, freqEnd: f * 0.9 }); }); },
    highScore: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.16, { type: 'sine', vol: 0.18, delay: i * 0.09 }); }); }
  };

  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ═══════════════════════════════════════════════════════════════
  //  State
  // ═══════════════════════════════════════════════════════════════
  var ball = null;      // {x,y}
  var state = 'ready';  // ready | rolling | flying | settle | over
  var score = 0, ballsLeft = BALLS_PER_GAME;
  var best = 0;
  try { best = parseInt(localStorage.getItem('skeeball_best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // Flight animation (cosmetic; landing is precomputed)
  var flight = null;    // {t, T, x0, y0, x1, y1, peakZ}
  var particles = [];   // {x,y,vx,vy,life,hue,size}
  var popups = [];      // {x,y,text,life,color}
  var landedBall = null; // {x,y,z,sinkT,hue}

  function resetBall() {
    ball = { x: BALL_START.x, y: BALL_START.y };
    state = 'ready';
    flight = null;
    landedBall = null;
  }

  function newGame() {
    score = 0;
    ballsLeft = BALLS_PER_GAME;
    particles = [];
    popups = [];
    landedBall = null;
    updateHUD();
    resetBall();
    overlay.classList.remove('show');
  }

  function updateHUD() {
    scoreEl.textContent = score;
    for (var i = 0; i < bdotEls.length; i++) {
      bdotEls[i].classList.toggle('spent', i >= ballsLeft);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  //  Input — push the ball forward to roll it
  // ═══════════════════════════════════════════════════════════════
  var dragging = false, dragStart = null, dragCur = null, dragId = null;

  function toLogical(e) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * LW,
      y: (e.clientY - r.top) / r.height * LH
    };
  }
  function ballReadyForDrag(p) {
    if (state !== 'ready') return false;
    return Math.hypot(p.x - ball.x, p.y - ball.y) < 70;
  }
  // Derive power + aim from the current drag gesture.
  function dragPowerAim() {
    if (!dragStart || !dragCur) return { power: 0, aim: 0, push: 0 };
    var push = Math.max(0, dragStart.y - dragCur.y);          // pushed up = power
    var power = Math.min(1, push / MAX_PUSH);
    var aim = Math.max(-AIM_MAX, Math.min(AIM_MAX, dragCur.x - ball.x)); // sideways = aim
    return { power: power, aim: aim, push: push };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'ready') return;
    var p = toLogical(e);
    if (!ballReadyForDrag(p)) return;
    dragging = true; dragId = e.pointerId;
    dragStart = { x: ball.x, y: ball.y };
    dragCur = p;
    canvas.classList.add('rolling');
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || e.pointerId !== dragId) return;
    dragCur = toLogical(e);
    e.preventDefault();
  });

  function endDrag(e, cancelled) {
    if (!dragging || e.pointerId !== dragId) return;
    dragging = false;
    canvas.classList.remove('rolling');
    if (cancelled) { dragStart = null; return; }
    var pa = dragPowerAim();
    if (pa.push < MIN_PUSH) { dragStart = null; return; }   // too weak — ignore
    launch(pa.power, pa.aim);
    dragStart = null;
  }
  canvas.addEventListener('pointerup', function (e) { endDrag(e, false); });
  canvas.addEventListener('pointercancel', function (e) { endDrag(e, true); });

  document.getElementById('againBtn').addEventListener('click', function () {
    ensureAudio();
    newGame();
  });

  // ═══════════════════════════════════════════════════════════════
  //  Physics / flight
  // ═══════════════════════════════════════════════════════════════
  function launch(power, aimOffset) {
    var land = landingFor(power, aimOffset);
    // Animate: roll up the lane to the hump, then hop to the landing point.
    flight = {
      t: 0, T: 0.42 + power * 0.12,
      x0: ball.x, y0: ball.y,
      x1: land.x, y1: land.y,
      peakZ: 26 + power * 10
    };
    state = 'flying';
    sfx.roll(power);
    hintEl.classList.add('hidden');
  }

  function resolveLanding() {
    var b = ball;
    var hit = ringFor(b.x, b.y);
    if (hit.value > 0) {
      score += hit.value;
      bestEl.textContent = Math.max(best, score);
      updateHUD();
      sfx.score(hit.value);
      var hue = RING_HUES[hit.value];
      spawnParticles(hit.value === 1000 ? CENTER.x : b.x, hit.value === 1000 ? CENTER.y : b.y, hue, 14);
      popups.push({ x: b.x, y: b.y - 14, text: '+' + hit.value, life: 1, color: 'hsl(' + hue + ',85%,72%)' });
      landedBall = { x: b.x, y: b.y, z: 0, sinkT: 0, hue: hue };
      ball = null;
      finishBall();
    } else {
      popups.push({ x: b.x, y: Math.max(150, b.y - 14), text: 'Miss', life: 1, color: 'hsl(0,50%,60%)' });
      sfx.miss();
      ball = null;
      finishBall();
    }
  }

  function step(dt) {
    if (landedBall && landedBall.sinkT < 1) landedBall.sinkT = Math.min(1, landedBall.sinkT + dt / 0.4);

    if (state === 'flying' && flight) {
      var f = flight;
      f.t += dt;
      if (f.t >= f.T) {
        ball.x = f.x1; ball.y = f.y1;
        flight = null;
        resolveLanding();
      } else {
        var k = f.t / f.T;
        ball.x = f.x0 + (f.x1 - f.x0) * k;
        ball.y = f.y0 + (f.y1 - f.y0) * k;
      }
    }
  }

  function finishBall() {
    sfx.ballDone();
    ballsLeft--;
    updateHUD();
    if (ballsLeft <= 0) {
      state = 'over';
      endGame();
    } else {
      state = 'settle';
      setTimeout(function () { if (state === 'settle') resetBall(); }, 700);
    }
  }

  function rankFor(s) {
    if (s >= 9000) return '👑 Skee-Ball Legend';
    if (s >= 7000) return '🥇 Master Thrower';
    if (s >= 5000) return '🥈 Champion';
    if (s >= 3000) return '🥉 Pro Player';
    if (s >= 1500) return '⭐ Amateur';
    if (s >= 600) return '🎳 Rookie';
    return '🐣 Bumper Ball';
  }

  function endGame() {
    var isHigh = score > best;
    if (isHigh) {
      best = score;
      try { localStorage.setItem('skeeball_best', String(best)); } catch (e) {}
      bestEl.textContent = best;
    }
    finalEl.textContent = score;
    rankEl.textContent = rankFor(score);
    newHighEl.classList.toggle('show', isHigh);
    setTimeout(function () {
      overlay.classList.add('show');
      if (isHigh) sfx.highScore(); else sfx.gameOver();
    }, 650);
  }

  // ═══════════════════════════════════════════════════════════════
  //  Particles & popups
  // ═══════════════════════════════════════════════════════════════
  function spawnParticles(x, y, hue, count) {
    count = count || 10;
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 130;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.4,
        hue: hue, size: 1.5 + Math.random() * 2.5
      });
    }
  }
  function stepFx(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
    }
    for (var j = popups.length - 1; j >= 0; j--) {
      var q = popups[j];
      q.life -= dt * 1.1;
      if (q.life <= 0) { popups.splice(j, 1); continue; }
      q.y -= 34 * dt;
    }
  }

  // ═══════════════════════════════════════════════════════════════
  //  Rendering
  // ═══════════════════════════════════════════════════════════════
  var scale = 1;
  function resize() {
    var stage = document.getElementById('stage');
    var w = stage.clientWidth, h = stage.clientHeight;
    var dpr = Math.min(2.5, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = Math.min(canvas.width / LW, canvas.height / LH);
  }
  window.addEventListener('resize', resize);

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawLane() {
    var floor = ctx.createLinearGradient(0, 0, 0, LH);
    floor.addColorStop(0, '#0a100a');
    floor.addColorStop(1, '#0e160e');
    ctx.fillStyle = floor;
    ctx.fillRect(0, 0, LW, LH);

    // Target wall backdrop (behind the rings)
    var wallTop = 12, wallBot = 300;
    var wg = ctx.createLinearGradient(0, wallTop, 0, wallBot);
    wg.addColorStop(0, 'rgba(22,32,22,0.95)');
    wg.addColorStop(1, 'rgba(30,44,28,0.55)');
    ctx.fillStyle = wg;
    roundRect(48, wallTop, LW - 96, wallBot - wallTop, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(134,196,118,0.35)';
    ctx.lineWidth = 2;
    roundRect(48, wallTop, LW - 96, wallBot - wallTop, 14);
    ctx.stroke();

    // Lane surface
    var lg = ctx.createLinearGradient(LANE.x, 0, LANE.x + LANE.w, 0);
    lg.addColorStop(0, '#1a2418');
    lg.addColorStop(0.5, '#243421');
    lg.addColorStop(1, '#1a2418');
    ctx.fillStyle = lg;
    roundRect(LANE.x, LANE.y, LANE.w, LANE.h, 14);
    ctx.fill();

    // Lane guide lines
    ctx.strokeStyle = 'rgba(134,196,118,0.10)';
    ctx.lineWidth = 1;
    for (var g = 1; g < 4; g++) {
      var gx = LANE.x + LANE.w * g / 4;
      ctx.beginPath();
      ctx.moveTo(gx, LANE.y + 10);
      ctx.lineTo(gx, LANE.y + LANE.h - 10);
      ctx.stroke();
    }

    // Lane gutters
    ctx.strokeStyle = 'rgba(134,196,118,0.35)';
    ctx.lineWidth = 3;
    roundRect(LANE.x, LANE.y, LANE.w, LANE.h, 14);
    ctx.stroke();

    // Ball-hop hump — a ski-jump trapezoid at the top of the lane
    var hx = LANE.x, hw = LANE.w, hy = HUMP_Y;
    var humpGrad = ctx.createLinearGradient(0, hy - 26, 0, hy + 8);
    humpGrad.addColorStop(0, 'rgba(245,230,168,0.5)');
    humpGrad.addColorStop(1, 'rgba(134,196,118,0.15)');
    ctx.fillStyle = humpGrad;
    ctx.beginPath();
    ctx.moveTo(hx + 6, hy + 6);
    ctx.lineTo(hx + hw * 0.28, hy - 24);
    ctx.lineTo(hx + hw * 0.72, hy - 24);
    ctx.lineTo(hx + hw - 6, hy + 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(245,230,168,0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = '700 9px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(245,230,168,0.6)';
    ctx.fillText('BALL-HOP', LW / 2, hy - 10);
    ctx.textAlign = 'left';
  }

  function drawRings() {
    // Concentric rings, outer (50) to inner (1000).
    for (var i = RINGS.length - 1; i >= 0; i--) {
      var ring = RINGS[i];
      var hue = RING_HUES[ring.value];
      var cx = CENTER.x, cy = CENTER.y, r = ring.r;
      // Fill
      var fill = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r);
      fill.addColorStop(0, 'hsla(' + hue + ',55%,26%,0.95)');
      fill.addColorStop(1, 'hsla(' + hue + ',60%,16%,0.95)');
      ctx.fillStyle = fill;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      // Rim
      ctx.strokeStyle = 'hsla(' + hue + ',80%,62%,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }
    // Center hole (1000)
    ctx.fillStyle = '#050805';
    ctx.beginPath(); ctx.arc(CENTER.x, CENTER.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'hsla(45,85%,65%,0.95)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(CENTER.x, CENTER.y, 9, 0, Math.PI * 2); ctx.stroke();

    // Value labels on the vertical axis (top of each ring)
    ctx.font = '700 10px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    for (var j = 0; j < RINGS.length; j++) {
      var rr = RINGS[j];
      var ly = CENTER.y - rr.r + 11;
      ctx.fillStyle = 'hsla(' + RING_HUES[rr.value] + ',80%,78%,0.95)';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 2.5;
      ctx.strokeText(rr.value, CENTER.x, ly);
      ctx.fillText(rr.value, CENTER.x, ly);
    }
    ctx.textAlign = 'left';
  }

  function ballZ() {
    if (state !== 'flying' || !flight) return 0;
    var k = flight.t / flight.T;
    return 4 * flight.peakZ * k * (1 - k);
  }

  function drawBall() {
    if (!ball) {
      if (landedBall) {
        var lb = landedBall;
        var k = lb.sinkT;
        var rad = BALL_R * (1 - 0.7 * k);
        ctx.globalAlpha = 1 - 0.8 * k;
        var bg = ctx.createRadialGradient(lb.x - 3, lb.y - 3, 1, lb.x, lb.y, rad);
        bg.addColorStop(0, '#ffe9a8');
        bg.addColorStop(0.55, '#f5b041');
        bg.addColorStop(1, '#b06a14');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(lb.x, lb.y, rad, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      return;
    }
    var b = ball;
    var z = ballZ();
    var drawY = b.y - z * 0.8;

    // Shadow (stays on the ground)
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(b.x + 3, b.y + 5, BALL_R * 0.95, BALL_R * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();

    // Glow
    var gl = ctx.createRadialGradient(b.x, drawY, 2, b.x, drawY, BALL_R * 2.4);
    gl.addColorStop(0, 'rgba(255,190,80,0.35)');
    gl.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(b.x, drawY, BALL_R * 2.4, 0, Math.PI * 2); ctx.fill();

    // Body
    var bg2 = ctx.createRadialGradient(b.x - 4, drawY - 4, 1, b.x, drawY, BALL_R);
    bg2.addColorStop(0, '#ffe9a8');
    bg2.addColorStop(0.55, '#f5b041');
    bg2.addColorStop(1, '#b06a14');
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.arc(b.x, drawY, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(80,45,5,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawAim() {
    if (!dragging || !dragStart) return;
    var pa = dragPowerAim();
    if (pa.push < 4) return;
    var land = landingFor(pa.power, pa.aim);

    // Predicted landing marker + highlight the ring it's in
    var hue = land.ring ? RING_HUES[land.ring.value] : 0;
    ctx.strokeStyle = 'hsla(' + hue + ',85%,65%,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(land.x, land.y, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'hsla(' + hue + ',85%,70%,0.35)';
    ctx.beginPath(); ctx.arc(land.x, land.y, 8, 0, Math.PI * 2); ctx.fill();

    // Ball travels from its start to the predicted landing
    ctx.strokeStyle = 'rgba(245,230,168,0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(land.x, land.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Power band around the ball (how far you've pushed)
    var pw = pa.power;
    ctx.strokeStyle = 'hsla(' + (60 - 40 * pw) + ',90%,60%,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pw);
    ctx.stroke();

    // Power readout
    ctx.font = '800 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'hsla(' + (60 - 40 * pw) + ',90%,70%,0.95)';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 3;
    var label = land.ring ? '→ ' + land.ring.value : '→ miss';
    ctx.strokeText(label, ball.x, ball.y + 34);
    ctx.fillText(label, ball.x, ball.y + 34);
    ctx.textAlign = 'left';
  }

  function drawFx() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.fillStyle = 'hsl(' + p.hue + ',85%,68%)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (var j = 0; j < popups.length; j++) {
      var q = popups[j];
      ctx.globalAlpha = Math.max(0, Math.min(1, q.life));
      ctx.font = '800 15px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = q.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 3;
      ctx.strokeText(q.text, q.x, q.y);
      ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // ═══════════════════════════════════════════════════════════════
  //  Main loop
  // ═══════════════════════════════════════════════════════════════
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    step(dt);
    stepFx(dt);

    ctx.setTransform(scale, 0, 0, scale, (canvas.width - LW * scale) / 2, (canvas.height - LH * scale) / 2);
    drawLane();
    drawRings();
    drawBall();
    drawAim();
    drawFx();

    requestAnimationFrame(frame);
  }

  newGame();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
